name: ✨ Feature Request
description: Suggest a new feature or enhancement for TiLoKit
title: "[FEATURE] "
labels: ["enhancement", "needs-triage"]
assignees:
  - tienld-0801

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! 🚀

  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: I would like TiLoKit to...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What category does this feature belong to?
      options:
        - New Framework Support
        - CLI Interface Improvement
        - Template Enhancement
        - Performance Optimization
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Describe your use case and how this feature would help you
    validations:
      required: true

  - type: checkboxes
    id: frameworks
    attributes:
      label: Related Frameworks (if applicable)
      options:
        - label: React
        - label: Vue.js
        - label: Angular
        - label: Django
        - label: Flask
        - label: Spring Boot
        - label: Express.js
        - label: Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would be helpful
        - High - Important for my workflow
        - Critical - Blocking my work
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request
