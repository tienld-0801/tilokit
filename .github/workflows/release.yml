name: Release and Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run tests
        run: go test -v ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest
          args: --timeout=5m

      - name: Set build variables
        run: |
          # Determine version from tag or manual input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          # Fallback to git describe if version is empty
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v0.1.0-dev")
          fi

          # Set environment variables
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

          # Determine if this is a prerelease
          if [[ "$VERSION" =~ (alpha|beta|rc|dev) ]] || [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          fi

          echo "Release version: $VERSION"
          echo "Is prerelease: ${IS_PRERELEASE:-false}"

      - name: Build multi-platform binaries
        run: |
          mkdir -p dist

          # Enhanced build flags with optimization
          LDFLAGS="-w -s -X main.Version=$VERSION -X main.BuildDate=$BUILD_DATE -X main.GitCommit=$GIT_COMMIT"

          # Build for multiple platforms with platform-specific optimizations
          declare -A platforms=(
            ["linux/amd64"]="CGO_ENABLED=0"
            ["linux/arm64"]="CGO_ENABLED=0"
            ["darwin/amd64"]="CGO_ENABLED=0"
            ["darwin/arm64"]="CGO_ENABLED=0 GOARM=" # Apple Silicon optimization
            ["windows/amd64"]="CGO_ENABLED=0"
            ["windows/arm64"]="CGO_ENABLED=0"
          )

          for platform in "${!platforms[@]}"; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            BUILD_ENV=${platforms[$platform]}

            output_name="tilokit-$GOOS-$GOARCH"
            if [ "$GOOS" = "windows" ]; then
              output_name="${output_name}.exe"
            fi

            echo "🔨 Building for $GOOS/$GOARCH with optimizations..."

            # Platform-specific build with optimizations
            if [ "$GOOS" = "darwin" ] && [ "$GOARCH" = "arm64" ]; then
              # Apple Silicon specific optimizations
              echo "  └─ Applying Apple Silicon optimizations"
              env GOOS=$GOOS GOARCH=$GOARCH $BUILD_ENV go build \
                -ldflags "$LDFLAGS" \
                -trimpath \
                -buildmode=exe \
                -o "dist/$output_name" .
            else
              # Standard build for other platforms
              env GOOS=$GOOS GOARCH=$GOARCH $BUILD_ENV go build \
                -ldflags "$LDFLAGS" \
                -trimpath \
                -o "dist/$output_name" .
            fi

            # Verify binary was created
            if [ ! -f "dist/$output_name" ]; then
              echo "❌ Failed to build $output_name"
              exit 1
            fi

            # Generate checksums
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$output_name" > "${output_name}.sha256"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$output_name" > "${output_name}.sha256"
            fi
            cd ..

            echo "  ✅ Built $output_name ($(du -h dist/$output_name | cut -f1))"
          done

          echo ""
          echo "📦 Build Summary:"
          ls -la dist/ | grep -E '\.(exe)?$' || true
          echo ""
          echo "🔐 Checksums:"
          ls -la dist/*.sha256 || true

      - name: Create GitHub Pages deployment
        run: |
          mkdir -p pages
          cp dist/* pages/
          cp scripts/install.sh pages/
          cp .github/logo.svg pages/

          # Generate release page from HTML template
          echo "🎨 Generating release page from template..."
          chmod +x .github/scripts/generate-release-page.sh
          ./.github/scripts/generate-release-page.sh $VERSION pages/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-github-pages@v3.1.12
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          force_orphan: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.3.2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            dist/*
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          draft: false
          # GitHub will auto-generate release notes from commits and PRs
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
