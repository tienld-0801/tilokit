name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Run linter
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: latest
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Build binary
        run: go build -v -o tilokit .

      - name: Test binary
        run: |
          ./tilokit -v
          ./tilokit -l

  # Only run integration tests on PRs (already verified when merging to develop)
  integration-test:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'pull_request'

    strategy:
      matrix:
        framework: [react, vue]
        language: [js]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm is preinstalled on GitHub runners
      # No need to install yarn/pnpm

      - name: Clean Go cache
        run: go clean -modcache

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o tilokit .

      - name: Test project generation
        run: |
          PROJECT_NAME="test-${{ matrix.framework }}-${{ matrix.language }}"
          ./tilokit -i -n "$PROJECT_NAME" -f ${{ matrix.framework }} -b vite -L ${{ matrix.language }} -q

      - name: Clean up
        run: |
          rm -rf test-*

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: false

      - name: Run Gosec Security Scanner
        uses: securego/gosec@cee0aeae8a8b6c2d59571e500bc69010f2630db6
        with:
          args: './...'
